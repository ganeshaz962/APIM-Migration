name: Platform APIM Publisher

on:
  workflow_call:
    inputs:
      AZURE_TENANT_ID:
        required: false
        type: string
        default: "fdc35ca1-06b0-4fc1-b60e-d958bbf34540"
      AZURE_SUBSCRIPTION_ID:
        required: false
        type: string
        default: "874a43ac-9423-4b7e-b030-b6023db7be8b"
      AZURE_RESOURCE_GROUP_NAME:
        required: true
        type: string
      API_MANAGEMENT_SERVICE_NAME:
        required: true
        type: string
      API_MANAGEMENT_ENVIRONMENT:
        required: false
        type: string
        default: "test"
      # CONFIGURATION_YAML_PATH:
      #   required: false
      #   type: string
      API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH:
        required: true
        type: string
      TARGET_WORKSPACE_NAME:
        description: "Destination APIM workspace to nest the artifacts under before publishing. Leave empty to publish at the global (non-workspace) level."
        required: false
        type: string
        default: ""
      TARGET_API_NAME:
        description: "When the extracted artifacts folder contains more than one API, prune it down to just this API before publishing. Leave empty to publish everything found."
        required: false
        type: string
        default: ""
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true

env:
  apiops_release_version: v6.0.2-alpha.1.0.2
  #By default, this will be Information but if you want something different you will need to add a variable in the Settings -> Environment -> Environment variables section here
  Logging__LogLevel__Default: ${{ vars.LOG_LEVEL }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.API_MANAGEMENT_ENVIRONMENT }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Filter artifacts down to target API
        if: ${{ inputs.TARGET_API_NAME != '' }}
        shell: pwsh
        run: |
          ./scripts/filter-artifacts-for-api.ps1 `
            -ArtifactsRootPath "${{ GITHUB.WORKSPACE }}/${{ inputs.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}" `
            -TargetApiName "${{ inputs.TARGET_API_NAME }}"

      # Run Spectral
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @stoplight/spectral-cli
      - run: spectral lint "${{ GITHUB.WORKSPACE }}/${{ inputs.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}/apis/**/*.{json,yml,yaml}" --ruleset https://raw.githubusercontent.com/connectedcircuits/devops-api-linter/main/rules.yaml

      - name: Remove built-in system groups from artifacts
        shell: pwsh
        run: |
          ./scripts/remove-system-groups.ps1 `
            -ArtifactsRootPath "${{ GITHUB.WORKSPACE }}/${{ inputs.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}"

      - name: Nest artifacts under destination workspace
        if: ${{ inputs.TARGET_WORKSPACE_NAME != '' }}
        shell: pwsh
        run: |
          ./scripts/restructure-for-workspace.ps1 `
            -ArtifactsRootPath "${{ GITHUB.WORKSPACE }}/${{ inputs.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}" `
            -WorkspaceName "${{ inputs.TARGET_WORKSPACE_NAME }}"

      - name: Run publisher #without Config Yaml
        #if: ( inputs.CONFIGURATION_YAML_PATH == '' && inputs.API_MANAGEMENT_ENVIRONMENT == 'test')
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP_NAME: ${{ inputs.AZURE_RESOURCE_GROUP_NAME }}
          API_MANAGEMENT_SERVICE_NAME: ${{ inputs.API_MANAGEMENT_SERVICE_NAME }}
          API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH: ${{ GITHUB.WORKSPACE }}/${{ inputs.API_MANAGEMENT_SERVICE_OUTPUT_FOLDER_PATH }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $VerbosePreference = "Continue"
          $InformationPreference = "Continue"

          Write-Information "Setting name variables..."
          $releaseFileName = "publisher-linux-x64.zip"
          $executableFileName = "publisher"

          if ("${{ runner.os }}" -like "*win*") {
            $releaseFileName = "publisher-win-x64.zip"
            $executableFileName = "publisher.exe"
          }
          elseif ("${{ runner.os }}" -like "*mac*" -and "${{ runner.arch }}" -like "*arm*") {
            $releaseFileName = "publisher-osx-arm64.zip"
          }
          elseif ("${{ runner.os }}" -like "*mac*" -and "${{ runner.arch }}" -like "*x86_64*") {
            $releaseFileName = "publisher-osx-x64.zip"
          }

          Write-Information "Downloading release..."
          $uri = "https://github.com/Azure/apiops/releases/download/${{ env.apiops_release_version }}/$releaseFileName"
          $downloadFilePath = Join-Path "${{ runner.temp }}" $releaseFileName
          Invoke-WebRequest -Uri "$uri" -OutFile "$downloadFilePath"

          Write-Information "Extracting release..."
          $executableFolderPath = Join-Path "${{ runner.temp }}" "publisher"
          Expand-Archive -Path "$downloadFilePath" -DestinationPath "$executableFolderPath"
          $executableFilePath = Join-Path "$executableFolderPath" $executableFileName

          Write-Information "Setting file permissions..."
          if ("${{ runner.os }}" -like "*linux*")
          {
            & chmod +x "$executableFilePath"
            if ($LASTEXITCODE -ne 0) { throw "Setting file permissions failed."}
          }

          Write-Information "Running publisher..."
          & "$executableFilePath"
          if ($LASTEXITCODE -ne 0) { throw "Running publisher failed."}

          Write-Information "Execution complete."
        shell: pwsh

