# Overrides applied at publish time so real secret values (never returned by the
# extractor) are injected into the destination named values instead of being skipped.
# Token placeholders are substituted from GitHub secrets by the publisher workflow.
namedValues:
  - name: nv-api1-api-key
    properties:
      displayName: nv-api1-api-key
      value: "{#ordersApiKeyValue#}"
      secret: true
  - name: nv-api2-secret-header
    properties:
      displayName: nv-api2-secret-header
      value: "{#paymentsSecretHeaderValue#}"
      secret: true
